name: Enable Upcoming Profile Engagement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enable-upcoming-engagement
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Test preview engagement integration
        run: node --test tests/upcoming-operator-previews.test.js tests/upcoming-engagement.test.js tests/build-operator-pages.test.js
      - name: Enable and verify preview views and reactions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node tools/enable-upcoming-engagement.js
