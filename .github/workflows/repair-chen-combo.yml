name: Repair Chen Combo Self Trigger

on:
  push:
    branches: [main]
    paths:
      - supabase/chen_combo_self_trigger.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-chen-combo
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test Chen combo repair and trigger behavior
        run: node --test tests/chen-combo.test.js
      - name: Repair and verify Chen combo in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node tools/repair-chen-combo.js
