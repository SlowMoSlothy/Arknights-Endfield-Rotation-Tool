name: Refresh Arsenal SEO snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: arsenal-seo-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-arsenal-snapshot.mjs
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add endfield/arsenal/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Arsenal Exchange static SEO snapshot"
            git push
          fi
