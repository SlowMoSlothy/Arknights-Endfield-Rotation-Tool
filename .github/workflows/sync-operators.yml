name: Import Operator Database

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the validated operator catalog to Supabase
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: operator-catalog-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test operator importer
        run: node --test tests/operator-import.test.js tests/operator-catalog.test.js
      - name: Fetch and validate operators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APPLY_CATALOG: ${{ inputs.apply }}
        run: |
          if [ "$APPLY_CATALOG" = "true" ]; then
            node tools/sync-endfield-operators.js --apply
          else
            node tools/sync-endfield-operators.js
          fi
      - name: Save import report and SQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-catalog-import
          include-hidden-files: true
          path: .cache/operator-import/
      - name: Refresh database SEO pages
        if: inputs.apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-operator-pages.yml --ref main
